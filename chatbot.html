    <div id="header-0"></div>

    <div class="site-wrapper">
      <div class="main-container">
        <!-- Chat Panel -->
        <div class="form-panel login-panel">
          <form onsubmit="event.preventDefault(); sendMessage();">
            <h1>Wellness Chatbot</h1>
            <span>A safe space to talk and find support.</span>

            <div class="chatbot-box">
              <div class="chatbot-header">💖 Mental Health Support</div>
              <div class="chatbot-body" id="chatBody"></div>
              <div class="chatbot-input">
                <input
                  type="text"
                  id="userInput"
                  placeholder="Type your message..."
                />
                <button type="button" class="send-btn" onclick="sendMessage()">
                  <i class="fas fa-paper-plane"></i>
                </button>
              </div>
            </div>
          </form>
        </div>

        <!-- Contact Form Panel -->
        <div class="form-panel register-panel">
          <form>
            <h1>Contact Our Team</h1>
            <span>Send your message and we'll get back to you shortly.</span>

            <div class="input-group">
              <i class="fas fa-user"></i>
              <input type="text" placeholder="Name" required />
            </div>

            <div class="input-group">
              <i class="fas fa-envelope"></i>
              <input type="email" placeholder="Email" required />
            </div>

            <div class="input-group">
              <i class="fas fa-phone"></i>
              <input type="tel" placeholder="Phone Number" />
            </div>

            <div class="input-group textarea-group">
              <i class="fas fa-comment-dots"></i>
              <textarea placeholder="Message..." required></textarea>
            </div>

            <button type="submit" class="Contact1">Contact</button>
          </form>
        </div>

        <!-- Overlay Panel -->
        <div class="overlay-sections-container">
          <div class="overlay-background">
            <div class="overlay-content overlay-left-side">
              <h1>Talk to Our Bot</h1>

              <button class="transparent-btn" onclick="togglePanel(false)">
                Chat
              </button>
            </div>
            <div class="overlay-content overlay-right-side">
              <h1>Need Professional Help?</h1>
              <p>Contact our team for further assistance.</p>
              <button class="transparent-btn" onclick="togglePanel(true)">
                Contact
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

          container.classList.remove("right-panel-active-toggle");
        }

      const ADMIN_GREETING =
        "🛠️ Dev Mode Activated. Welcome, Trainer. Available Options: 'Ad QnA', 'show QnA', 'AdminExit'.";

      function sendMessage() {
        const input = document.getElementById("userInput");
        const message = input.value.trim();
        const chatBody = document.getElementById("chatBody");
        if (!message) return;

        // Show user message
        const userMsg = document.createElement("div");
        userMsg.className = "user-message";
        userMsg.textContent = message;
        chatBody.appendChild(userMsg);

        // --- Admin Commands ---
        if (message === "Admin@b2c") {
          isDevMode = true;
          showBotMessage(ADMIN_GREETING);
          return;
        }

        if (message === "AdminExit") {
          isDevMode = false;
          waitingForAnswer = false;
          tempQuestion = "";
          showBotMessage("✅ Exited Dev Mode. Back to support mode.");
          return;
        }

        if (isDevMode && message.toLowerCase() === "ad qna") {
          waitingForAnswer = true;
          showBotMessage(
            "📝 Got it. Please type the **question** you want to train."
          );
          return;
        }

        if (isDevMode && message.toLowerCase() === "show qna") {
          const keys = Object.keys(trainingData);
          if (keys.length === 0) {
            showBotMessage("❌ No QnA pairs added yet.");
          } else {
            showBotMessage("🧠 Current QnA Training Data:");
            keys.forEach((q) => {
              showBotMessage(`Q: ${q}`);
            });
          }
          return;
        }

        // --- Core Logic ---
        if (isDevMode) {
          handleDevTraining(message);
        } else {
          handleUserFlow(message);
        }

        input.value = "";
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      function handleDevTraining(msg) {
        if (waitingForAnswer) {
          if (tempQuestion === "") {
            // Step 1: User has typed the Question
            tempQuestion = msg.toLowerCase().trim();
            showBotMessage(
              "Got the question. Now, type the **answer** for it."
            );
          } else {
            // Step 2: User has typed the Answer
            trainingData[tempQuestion] = msg;
            showBotMessage(`✅ Trained:\nQ: "${tempQuestion}"\nA: "${msg}"`);
            waitingForAnswer = false;
            tempQuestion = "";
          }
        } else {
          showBotMessage(`I'm in Dev Mode. Use 'Ad QnA' or 'show QnA'.`);
        }
      }

      function handleUserFlow(msg) {
        // --- Triage Flow (Steps 0, 1, 2) ---
        if (triageStep === 0) {
          triageStep = 1;
          showBotMessage("👋 Welcome! I'm here to listen. What is your name?");
          return;
        }

        if (triageStep === 1) {
          triageData.name = msg;
          triageStep = 2;
          showBotMessage(
            `It's good to connect, ${triageData.name}. How are you feeling right now? (e.g., Anxious, Sad, Stressed, Okay)`
          );
          return;
        }

        if (triageStep === 2) {
          triageData.feeling = msg;
          triageStep = 3;
          let initialResponse = `Thank you for sharing, ${triageData.name}. I hear that you are feeling **${triageData.feeling}**.\n\n`;

          if (
            triageData.feeling.toLowerCase().includes("anxi") ||
            triageData.feeling.toLowerCase().includes("panic")
          ) {
            initialResponse +=
              "When feeling overwhelmed, try the **4-7-8 breathing** technique: Inhale 4 seconds, Hold 7 seconds, Exhale 8 seconds. This can help calm your nervous system. Ask me about **grounding** next.";
          } else if (
            triageData.feeling.toLowerCase().includes("sad") ||
            triageData.feeling.toLowerCase().includes("depress")
          ) {
            initialResponse +=
              "Remember that your feelings are valid. Can you tell me one small thing you can do for yourself right now, like having a glass of water or stretching? Ask me about **self-care** next.";
          } else if (
            triageData.feeling.toLowerCase().includes("stress") ||
            triageData.feeling.toLowerCase().includes("overwhelmed")
          ) {
            initialResponse +=
              "Stress can be overwhelming. Try the **'brain dump'** method: write down *everything* that's stressing you out. Then, ask me about **coping mechanisms**.";
          } else {
            initialResponse +=
              "I'm here to provide support and resources. You can now ask me anything about coping skills, mindfulness, or finding professional help. Start by asking, **'what is mindfulness'**.";
          }
          showBotMessage(initialResponse);
          return;
        }

        // --- Main Q&A After Triage (Fuzzy Matching Logic Applied) ---
        if (triageStep >= 3) {
          const lowerMsg = msg.toLowerCase().trim();

          // 1. Direct match (for exact trained Q&A)
          if (trainingData[lowerMsg]) {
            showBotMessage(trainingData[lowerMsg]);
            return;
          }

          // 2. FUZZY MATCHING based on common keywords

          // Anxiety, Panic, Worry
          if (
            lowerMsg.includes("anxi") ||
            lowerMsg.includes("panic") ||
            lowerMsg.includes("worr") ||
            lowerMsg.includes("scared")
          ) {
            showBotMessage(
              "I hear the anxiety is strong right now. Let's try to gently anchor you. Try the **5-4-3-2-1 grounding technique**: Name 5 things you see, 4 things you touch, 3 things you hear, 2 things you smell, and 1 thing you taste. Remember to breathe deeply."
            );
            return;
          }

          // Sadness, Depression, Low Mood
          if (
            lowerMsg.includes("sad") ||
            lowerMsg.includes("depress") ||
            lowerMsg.includes("low") ||
            lowerMsg.includes("miserable")
          ) {
            showBotMessage(
              "It takes courage to express sadness. I recommend trying a simple **behavioral activation** step: put on a short, favorite song, or gently stretch. Small actions can shift your emotional state. Please be kind to yourself."
            );
            return;
          }

          // Stress, Overwhelmed, Fatigue
          if (
            lowerMsg.includes("stress") ||
            lowerMsg.includes("overwhelmed") ||
            lowerMsg.includes("burnout") ||
            lowerMsg.includes("tired")
          ) {
            showBotMessage(
              "Feeling stressed is normal, but exhausting. Let's look at your commitments. Try the **'Brain Dump'**: write down everything stressing you out, then pick one tiny thing to let go of or delegate. Reset your priorities."
            );
            return;
          }

          // Sleep Issues
          if (
            lowerMsg.includes("sleep") ||
            lowerMsg.includes("insomnia") ||
            lowerMsg.includes("rest")
          ) {
            showBotMessage(
              "Poor sleep can make everything harder. Try to avoid screens for 30 minutes before bed. Focus on making your room cool, dark, and quiet. Would you like a guided **sleep meditation** resource?"
            );
            return;
          }

          // Mindfulness and Techniques
          if (
            lowerMsg.includes("mindful") ||
            lowerMsg.includes("exercise") ||
            lowerMsg.includes("technique")
          ) {
            showBotMessage(
              "How about a quick **mindfulness exercise**? Find a simple object nearby (a pen, a mug). Examine it for 60 seconds. Notice its colors, textures, and shadows. This pulls you fully into the moment."
            );
            return;
          }

          // 3. Fallback response for unknown questions
          showBotMessage(
            "🤖 I'm a support bot and don't understand that question yet. Can you try asking about **breathing exercises**, **self-care**, or **finding a therapist**?"
          );
          return;
        }
      }

      function showBotMessage(text) {
        const chatBody = document.getElementById("chatBody");
        const botMsg = document.createElement("div");
        botMsg.className = "bot-message";
        botMsg.textContent = text;
        chatBody.appendChild(botMsg);
        chatBody.scrollTop = chatBody.scrollHeight;
      }

      // Initial greeting
      document.addEventListener("DOMContentLoaded", () => {
        showBotMessage(
          "👋 Welcome to your Wellness Chatbot. I'm here to listen and offer support. Say **Hi** to start our conversation."
        );
      });
    </script>
